# Windows runner checks (windows/bench). Manual only.
#   suite=speed  : whisper-server speed by model x audio_ctx x threads
#   suite=accept : Koe's transcription path (core.TranscribeUtterance) on 20
#                  sentences with small-q5_1 + audioCtx auto; pass / fail
#                  engine=parakeet / both adds Parakeet-ja (sherpa-onnx, CTC
#                  greedy, no prompt; the int8 model has no TDT head, so no
#                  hotwords) through the same path, as Koe's engine "parakeet"
#                  Estimate (2-core runner): parakeet alone ~6 min with runs 3
#                  (466 MB download on a cache miss, unpack ~1-2 min, 60
#                  utterances < 1 min); both ~15 min with runs 3 and prompts koe
#                  (~$0.15), ~20 min with prompts koe,short (~$0.20)
# Cost: windows runners are billed per minute
# ($0.010/min for 2 cores on private repositories), so the job is capped at
# 45 minutes, large-v3-turbo runs once per combination with all threads only,
# and the models are cached.
name: windows-bench

on:
  workflow_dispatch:
    inputs:
      suite:
        description: speed (models x audio_ctx x threads) or accept (Koe's path, pass / fail)
        type: choice
        options: [speed, accept]
        default: speed
      runs:
        description: requests per combination (speed) / per sentence (accept)
        default: "3"
      prompts:
        description: "accept: koe,short | koe | short"
        default: koe,short
      audioctx:
        description: "accept: window policies, e.g. auto | 0 | auto:768 | full<6 (comma-separated)"
        default: auto
      engine:
        description: "accept: whisper (small-q5_1) | parakeet (Parakeet-ja) | both"
        type: choice
        options: [whisper, parakeet, both]
        default: whisper

permissions:
  contents: read
  actions: read # job start time for the cost line

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: windows
    env:
      WHISPER_TAG: v1.9.2
      SHERPA_TAG: v1.13.8 # same as windows/build.sh and core.SherpaVersion
      SHERPA_SHA256: 4b0a94f7b5c606b1b64a19a831c2127559e4b3d34e195465ebc7be73d9ed4783 # same as windows/build.sh
      PARAKEET: sherpa-onnx-nemo-parakeet-tdt_ctc-0.6b-ja-35000-int8
      WANT_WHISPER: ${{ inputs.suite == 'speed' || inputs.engine != 'parakeet' }}
      WANT_PARAKEET: ${{ inputs.suite == 'accept' && inputs.engine != 'whisper' }}
      MODELS: ggml-base-q5_1.bin ggml-small-q5_1.bin ggml-large-v3-turbo-q5_0.bin
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3

      - uses: actions/setup-go@v5
        timeout-minutes: 5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      - name: Runner info
        timeout-minutes: 2
        run: |
          cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name" | tr -d '\r' | sed 's/ *$//')
          echo "CPU_NAME=$cpu" >> "$GITHUB_ENV"
          echo "LOGICAL_CPUS=$NUMBER_OF_PROCESSORS" >> "$GITHUB_ENV"
          echo "$cpu, $NUMBER_OF_PROCESSORS logical processors"

      - name: whisper.cpp ${{ env.WHISPER_TAG }} (same zip as windows/build.sh)
        if: env.WANT_WHISPER == 'true'
        timeout-minutes: 5
        run: |
          mkdir -p .cache
          curl -fsSL --retry 3 -o .cache/whisper.zip "https://github.com/ggml-org/whisper.cpp/releases/download/$WHISPER_TAG/whisper-bin-x64.zip"
          # only the server and its DLLs, flattened (Git Bash's unzip finds no match for build.sh's patterns)
          python -c "import os,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); os.makedirs(sys.argv[2],exist_ok=True); [open(os.path.join(sys.argv[2],os.path.basename(n)),'wb').write(z.read(n)) for n in z.namelist() if n.endswith(('/whisper-server.exe','.dll'))]" .cache/whisper.zip .cache/whisper
          ls .cache/whisper/whisper-server.exe

      - name: Restore models
        id: models
        if: env.WANT_WHISPER == 'true'
        uses: actions/cache/restore@v4
        timeout-minutes: 5
        with:
          path: windows/.cache/models
          key: whisper-models-v1-base-q5_1-small-q5_1-large-v3-turbo-q5_0

      - name: Download models
        if: env.WANT_WHISPER == 'true' && steps.models.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          mkdir -p .cache/models
          for m in $MODELS; do
            curl -fsSL --retry 3 -o ".cache/models/$m" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$m"
          done
          ls -la .cache/models

      - name: Save models
        if: env.WANT_WHISPER == 'true' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 5
        with:
          path: windows/.cache/models
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: sherpa-onnx ${{ env.SHERPA_TAG }} DLLs (same as windows/build.sh)
        if: env.WANT_PARAKEET == 'true'
        timeout-minutes: 5
        run: |
          name="sherpa-onnx-$SHERPA_TAG-win-x64-shared-MT-Release-no-tts"
          mkdir -p .cache
          curl -fsSL --retry 3 -o .cache/sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$SHERPA_TAG/$name.tar.bz2"
          echo "$SHERPA_SHA256  .cache/sherpa.tar.bz2" | sha256sum -c -
          python -c "import os,sys,tarfile; t=tarfile.open(sys.argv[1]); os.makedirs(sys.argv[2],exist_ok=True); [open(os.path.join(sys.argv[2],os.path.basename(m.name)),'wb').write(t.extractfile(m).read()) for m in t.getmembers() if m.name.startswith(sys.argv[3]+'/lib/') and m.name.endswith('.dll')]" .cache/sherpa.tar.bz2 .cache/sherpa "$name"
          ls -la .cache/sherpa

      - name: Restore Parakeet-ja
        id: parakeet
        if: env.WANT_PARAKEET == 'true'
        uses: actions/cache/restore@v4
        timeout-minutes: 5
        with:
          path: windows/.cache/parakeet
          key: parakeet-ja-35000-int8-v1

      - name: Download Parakeet-ja (466 MB)
        if: env.WANT_PARAKEET == 'true' && steps.parakeet.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          mkdir -p .cache/parakeet
          curl -fsSL --retry 3 -o ".cache/parakeet/$PARAKEET.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$PARAKEET.tar.bz2"
          ls -la .cache/parakeet

      - name: Save Parakeet-ja
        if: env.WANT_PARAKEET == 'true' && steps.parakeet.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 5
        with:
          path: windows/.cache/parakeet
          key: ${{ steps.parakeet.outputs.cache-primary-key }}

      - name: Build bench
        timeout-minutes: 5
        run: go build -o .cache/bench.exe ./bench && go build -o .cache/accept.exe ./bench/accept

      - name: accept — small-q5_1, Koe's path (${{ inputs.runs }} runs x 20 sentences; prompts ${{ inputs.prompts }}; audioctx ${{ inputs.audioctx }})
        if: inputs.suite == 'accept' && inputs.engine != 'parakeet'
        timeout-minutes: 25
        env:
          PROMPTS: ${{ inputs.prompts }}
          AUDIOCTX: ${{ inputs.audioctx }}
        run: .cache/accept.exe -server .cache/whisper/whisper-server.exe -model .cache/models/ggml-small-q5_1.bin -runs "${{ inputs.runs }}" -prompts "$PROMPTS" -audioctx "$AUDIOCTX" -out bench-out/accept.jsonl

      - name: accept — Parakeet-ja, Koe's engine "parakeet" (${{ inputs.runs }} runs x 20 sentences; unpack timed)
        if: ${{ !cancelled() && inputs.suite == 'accept' && inputs.engine != 'whisper' }}
        timeout-minutes: 12
        run: .cache/accept.exe -engine parakeet -parakeet-archive ".cache/parakeet/$PARAKEET.tar.bz2" -parakeet-model ".cache/models/$PARAKEET" -sherpa-dll .cache/sherpa/sherpa-onnx-c-api.dll -runs "${{ inputs.runs }}" -out bench-out/accept-parakeet.jsonl

      - name: base-q5_1 (threads 2 / 4 / all, ${{ inputs.runs }} runs)
        if: inputs.suite == 'speed'
        timeout-minutes: 8
        run: .cache/bench.exe -server .cache/whisper/whisper-server.exe -model .cache/models/ggml-base-q5_1.bin -threads 2,4,0 -runs "${{ inputs.runs }}" -out bench-out/results.jsonl

      - name: small-q5_1 (threads 2 / 4 / all, ${{ inputs.runs }} runs)
        if: ${{ !cancelled() && inputs.suite == 'speed' }}
        timeout-minutes: 15
        run: .cache/bench.exe -server .cache/whisper/whisper-server.exe -model .cache/models/ggml-small-q5_1.bin -threads 2,4,0 -runs "${{ inputs.runs }}" -out bench-out/results.jsonl

      - name: large-v3-turbo-q5_0 (all threads, 1 run)
        if: ${{ !cancelled() && inputs.suite == 'speed' }}
        timeout-minutes: 12
        run: .cache/bench.exe -server .cache/whisper/whisper-server.exe -model .cache/models/ggml-large-v3-turbo-q5_0.bin -threads 0 -runs 1 -out bench-out/results.jsonl

      - name: Summary
        if: always()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name=="bench") | .started_at' || true)
          minutes=$(python -c "import datetime,sys; s=sys.argv[1]; print('%.2f' % ((datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(s.replace('Z','+00:00'))).total_seconds()/60) if s else '')" "$started")
          args=(--cpu "$CPU_NAME" --logical-cpus "$LOGICAL_CPUS" ${minutes:+--minutes "$minutes"} --usd-per-minute 0.010)
          if [ "${{ inputs.suite }}" = accept ]; then
            rc=0
            if [ "${{ inputs.engine }}" != parakeet ]; then
              python bench/accept/summary.py bench-out/accept.jsonl "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || rc=1  # exits 1 on FAIL
            fi
            if [ "${{ inputs.engine }}" != whisper ]; then
              python bench/accept/summary.py bench-out/accept-parakeet.jsonl "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
            fi
            exit $rc
          else
            python bench/summary.py bench-out/results.jsonl "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        with:
          name: windows-bench
          path: windows/bench-out/
