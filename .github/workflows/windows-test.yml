# Runs windows/core's tests on a Windows runner (manual). The job summary
# shows the results, how long recounting term usage from a full history takes
# on Windows, and the job minutes / cost ($0.010/min, 2-core Windows,
# private repositories). Capped at 15 minutes.
name: windows-test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # job start time for the cost line

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: actions/setup-go@v5
        timeout-minutes: 3
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      - name: go vet
        timeout-minutes: 3
        run: go vet ./...

      - name: go test ./core ./bench/...
        timeout-minutes: 5
        run: go test -count=1 -v ./core ./bench/... 2>&1 | tee test.log

      - name: Summary
        if: always()
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import datetime, json, math, os, re, subprocess
          import sys; sys.stdout.reconfigure(encoding="utf-8")  # the Windows console defaults to cp1252
          log = open("test.log", encoding="utf-8", errors="replace").read() if os.path.exists("test.log") else ""
          passed, failed = len(re.findall(r"^--- PASS", log, re.M)), re.findall(r"^--- FAIL: (\S+)", log, re.M)
          print("## windows/core tests on Windows\n")
          print(f"- {passed} passed, {len(failed)} failed" + (": " + ", ".join(failed) if failed else ""))
          for l in log.splitlines():
              if "recompute from" in l:
                  print("- usage cache: " + l.split(": ", 1)[-1].strip())
          try:
              jobs = json.loads(subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"], capture_output=True, text=True).stdout)["jobs"]
              s = datetime.datetime.fromisoformat(jobs[0]["started_at"].replace("Z", "+00:00"))
              m = (datetime.datetime.now(datetime.timezone.utc) - s).total_seconds() / 60
              print(f"- job time: {m:.1f} min (billed {math.ceil(m)}) → estimated cost ${math.ceil(m) * 0.010:.2f}")
          except Exception as ex:
              print(f"- (job time unavailable: {ex})")
          EOF
